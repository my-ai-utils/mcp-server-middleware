[package]
name = "mcp-server-middleware-macros"
version = "0.9.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
json-schema-macros-core = { tag = "0.1.0", git = "https://github.com/my-jet-tools/json-schema.git" }

# Same syn major version as json-schema-macros-core: the parsed syn::DeriveInput is handed over to it
syn = { version = "3", features = ["extra-traits"] }
quote = "1"

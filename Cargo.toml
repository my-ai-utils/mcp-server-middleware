[package]
name = "mcp-server-middleware"
version = "0.9.0"
edition = "2024"

[workspace]
members = [".", "mcp-server-middleware-macros"]

[dependencies]
tokio = { version = "*", features = ["full"] }

my-http-server = { tag = "0.9.0", git = "https://github.com/MyJetTools/my-http-server.git" }

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git" }

uuid = { version = "*", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"


json-schema = { tag = "0.1.0", git = "https://github.com/my-jet-tools/json-schema.git" }
mcp-server-middleware-macros = { path = "mcp-server-middleware-macros" }

[dev-dependencies]
# Collecting SSE bodies from HttpOutput::Raw responses in tests.
http-body-util = "0.1"
